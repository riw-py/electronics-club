<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>หน้าหลัก — ชมรมอิเล็กทรอนิกส์</title>
  <meta name="description" content="ระบบบริหารจัดการชมรมอิเล็กทรอนิกส์ ข่าวสาร กิจกรรม และเอกสาร">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/sidebar.css">
  <style>
    /* Hero banner */
    .hero {
      background: linear-gradient(135deg, #0A1628 0%, #0D1F3C 50%, #091525 100%);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 2.5rem 2.5rem;
      margin-bottom: 2rem;
      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -10%;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(2, 136, 209, 0.12) 0%, transparent 70%);
    }

    .hero::after {
      content: '';
      position: absolute;
      bottom: -30%;
      left: 30%;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 214, 0, 0.06) 0%, transparent 70%);
    }

    .hero-content {
      position: relative;
      z-index: 1;
    }

    .hero-greeting {
      font-size: 0.9rem;
      color: var(--sky-light);
      margin-bottom: 0.5rem;
      font-weight: 500;
    }

    .hero-title {
      font-size: 1.9rem;
      font-weight: 900;
      margin-bottom: 0.5rem;
      line-height: 1.2;
    }

    .hero-sub {
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    .hero-stats {
      display: flex;
      gap: 2rem;
      margin-top: 1.75rem;
      flex-wrap: wrap;
    }

    .hero-stat {
      text-align: center;
    }

    .hero-stat-val {
      font-size: 1.75rem;
      font-weight: 800;
      color: var(--sky-light);
    }

    .hero-stat-lbl {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 0.1rem;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(255, 214, 0, 0.12);
      border: 1px solid rgba(255, 214, 0, 0.3);
      border-radius: 99px;
      padding: 0.3rem 0.85rem;
      font-size: 0.8rem;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 1rem;
    }

    .hero-circuit {
      position: absolute;
      right: 2rem;
      top: 50%;
      transform: translateY(-50%);
      font-size: 6rem;
      opacity: 0.04;
      z-index: 0;
      animation: float 6s ease-in-out infinite;
    }

    /* Section title */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.25rem;
    }

    .section-title {
      font-size: 1.1rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .section-title::before {
      content: '';
      width: 3px;
      height: 20px;
      background: linear-gradient(to bottom, var(--sky), var(--accent));
      border-radius: 2px;
    }

    /* News mini cards */
    .news-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
    }

    @media (max-width: 1100px) {
      .news-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 700px) {
      .news-grid {
        grid-template-columns: 1fr;
      }
    }

    /* Upcoming events list */
    .events-list {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }

    .event-row {
      display: flex;
      align-items: center;
      gap: 0.9rem;
      padding: 0.85rem 1rem;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      transition: all var(--transition);
    }

    .event-row:hover {
      background: var(--bg-hover);
      border-color: rgba(2, 136, 209, 0.4);
    }

    .event-date-box {
      width: 46px;
      min-width: 46px;
      text-align: center;
      background: var(--bg-elevated);
      border-radius: var(--radius-sm);
      padding: 0.35rem 0.25rem;
    }

    .event-date-d {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--text-primary);
      line-height: 1;
    }

    .event-date-m {
      font-size: 0.65rem;
      color: var(--text-muted);
    }

    .event-info {
      flex: 1;
      min-width: 0;
    }

    .event-title {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .event-meta {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 0.2rem;
    }

    .event-type-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* Welcome banner for no-auth state */
    .two-col {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 1.5rem;
    }

    @media (max-width: 900px) {
      .two-col {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/sidebar.js"></script>

  <main class="page-content" id="main-content">
    <!-- Hero -->
    <div class="hero">
      <div class="hero-circuit"><i class="fa-solid fa-bolt"></i></div>
      <div class="hero-content">
        <div class="hero-badge"><i class="fa-solid fa-bolt"></i> Electronics Club ECMS</div>
        <h1 class="hero-title">
          ยินดีต้อนรับ, <span class="text-gradient" id="hero-name">สมาชิก</span>
        </h1>
        <p class="hero-sub">ระบบบริหารจัดการชมรมอิเล็กทรอนิกส์ — จัดการสมาชิก ข่าวสาร กิจกรรม และเอกสาร</p>
        <div class="hero-stats">
          <div class="hero-stat">
            <div class="hero-stat-val" id="stat-news">—</div>
            <div class="hero-stat-lbl">ข่าวสาร</div>
          </div>
          <div class="hero-stat">
            <div class="hero-stat-val" id="stat-events">—</div>
            <div class="hero-stat-lbl">กิจกรรมที่กำลังมา</div>
          </div>
          <div class="hero-stat" data-role="admin">
            <div class="hero-stat-val" id="stat-docs">—</div>
            <div class="hero-stat-lbl">เอกสาร</div>
          </div>
          <div class="hero-stat">
            <div class="hero-stat-val" id="stat-members">—</div>
            <div class="hero-stat-lbl">สมาชิก</div>
          </div>
        </div>
      </div>
    </div>

    <div class="two-col">
      <!-- Left: Latest news -->
      <div>
        <div class="section-header">
          <h2 class="section-title">ข่าวสารล่าสุด</h2>
          <a href="news.html" class="btn btn-ghost btn-sm">ดูทั้งหมด →</a>
        </div>
        <div class="news-grid stagger" id="news-grid">
          <!-- Skeleton -->
          <!-- Skeleton -->
          <div class="card" style="min-height:200px">
            <div style="height:16px;background:var(--bg-elevated);border-radius:4px;width:40%;margin-bottom:0.75rem">
            </div>
            <div style="height:20px;background:var(--bg-elevated);border-radius:4px;width:90%;margin-bottom:0.5rem">
            </div>
            <div style="height:14px;background:var(--bg-elevated);border-radius:4px;width:75%"></div>
          </div>
          <div class="card" style="min-height:200px">
            <div style="height:16px;background:var(--bg-elevated);border-radius:4px;width:40%;margin-bottom:0.75rem">
            </div>
            <div style="height:20px;background:var(--bg-elevated);border-radius:4px;width:90%;margin-bottom:0.5rem">
            </div>
            <div style="height:14px;background:var(--bg-elevated);border-radius:4px;width:75%"></div>
          </div>
          <div class="card" style="min-height:200px">
            <div style="height:16px;background:var(--bg-elevated);border-radius:4px;width:40%;margin-bottom:0.75rem">
            </div>
            <div style="height:20px;background:var(--bg-elevated);border-radius:4px;width:90%;margin-bottom:0.5rem">
            </div>
            <div style="height:14px;background:var(--bg-elevated);border-radius:4px;width:75%"></div>
          </div>
        </div>
      </div>

      <!-- Right: Upcoming events -->
      <div>
        <div class="section-header">
          <h2 class="section-title">กิจกรรมที่กำลังมา</h2>
          <a href="events.html" class="btn btn-ghost btn-sm">ดูทั้งหมด →</a>
        </div>
        <div class="events-list" id="events-list">
          <div class="loading-overlay">
            <div class="spinner"></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const user = api.getUser();
      if (user) document.getElementById('hero-name').textContent = user.full_name.split(' ')[0];

      // Load stats
      try {
        const res = await api.get('/dashboard/stats');
        const s = res.data.stats;
        ['news', 'events', 'docs', 'members'].forEach((k, i) => {
          const vals = [s.published_news, s.upcoming_events, s.total_documents, s.total_members];
          const el = document.getElementById('stat-' + k);
          if (el) animateCount(el, vals[i] || 0);
        });

        // Render news
        const newsGrid = document.getElementById('news-grid');
        if (res.data.recentNews?.length) {
          newsGrid.innerHTML = res.data.recentNews.slice(0, 3).map(n => {
            const cleanExcerpt = (n.excerpt || '').replace(/<[^>]*>?/gm, '');
            const displayExcerpt = cleanExcerpt.substring(0, 100) + (cleanExcerpt.length > 100 ? '...' : '');
            const imageUrl = n.image_url ? (n.image_url.startsWith('http') ? n.image_url : API_BASE.replace('/api', '') + n.image_url) : null;
            return `
            <div class="news-card animate-slide-up">
              ${imageUrl
                ? `<img src="${imageUrl}" class="news-card-img" alt="${escHtml(n.title)}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
                   <div class="news-card-img-placeholder" style="display:none"><i class="fa-solid fa-newspaper"></i></div>`
                : `<div class="news-card-img-placeholder"><i class="fa-solid fa-newspaper"></i></div>`
              }
              <div class="news-card-body">
                <div class="news-card-category">${NEWS_CATEGORIES[n.category] || n.category}</div>
                <h3 class="news-card-title">${escHtml(n.title)}</h3>
                <p class="news-card-excerpt">${escHtml(displayExcerpt)}</p>
              </div>
              <div class="news-card-footer">
                <span style="font-size:0.75rem;color:var(--text-muted)">${timeAgo(n.created_at)}</span>
                <a href="news.html" class="btn btn-ghost btn-sm">อ่านต่อ</a>
              </div>
            </div>`;
          }).join('');
        } else {
          newsGrid.innerHTML = '<div class="empty-state"><div class="empty-state-icon"><i class="fa-solid fa-newspaper"></i></div><h3>ยังไม่มีข่าวสาร</h3></div>';
        }

        // Render events
        const eventsList = document.getElementById('events-list');
        if (res.data.upcomingEvents?.length) {
          const monthsShort = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
          eventsList.innerHTML = res.data.upcomingEvents.map(ev => {
            const d = new Date(ev.start_datetime);
            return `
          <div class="event-row">
            <div class="event-type-dot" style="background:${ev.color}"></div>
            <div class="event-date-box">
              <div class="event-date-d">${d.getDate()}</div>
              <div class="event-date-m">${monthsShort[d.getMonth()]}</div>
            </div>
            <div class="event-info">
              <div class="event-title">${escHtml(ev.title)}</div>
              <div class="event-meta">${ev.location || EVENT_TYPES[ev.type] || ev.type}</div>
            </div>
          </div>`;
          }).join('');
        } else {
          eventsList.innerHTML = '<div class="empty-state"><div class="empty-state-icon"><i class="fa-regular fa-calendar-days"></i></div><h3>ไม่มีกิจกรรมที่กำลังมา</h3></div>';
        }
      } catch (err) {
        // Fallback: load news separately
        try {
          const nr = await api.get('/news?limit=3&published=true');
          const newsGrid = document.getElementById('news-grid');
          if (nr.data?.length) {
            newsGrid.innerHTML = nr.data.map(n => {
              const cleanExcerpt = (n.excerpt || '').replace(/<[^>]*>?/gm, '');
              const displayExcerpt = cleanExcerpt.substring(0, 100) + (cleanExcerpt.length > 100 ? '...' : '');
              const imageUrl = n.image_url ? (n.image_url.startsWith('http') ? n.image_url : API_BASE.replace('/api', '') + n.image_url) : null;
              return `
              <div class="news-card animate-slide-up">
                ${imageUrl
                  ? `<img src="${imageUrl}" class="news-card-img" alt="${escHtml(n.title)}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
                     <div class="news-card-img-placeholder" style="display:none"><i class="fa-solid fa-newspaper"></i></div>`
                  : `<div class="news-card-img-placeholder"><i class="fa-solid fa-newspaper"></i></div>`
                }
                <div class="news-card-body">
                  <div class="news-card-category">${NEWS_CATEGORIES[n.category] || n.category}</div>
                  <h3 class="news-card-title">${escHtml(n.title)}</h3>
                  <p class="news-card-excerpt">${escHtml(displayExcerpt)}</p>
                </div>
                <div class="news-card-footer">
                  <span style="font-size:0.75rem;color:var(--text-muted)">${timeAgo(n.created_at)}</span>
                  <a href="news.html" class="btn btn-ghost btn-sm">อ่านต่อ</a>
                </div>
              </div>`;
            }).join('');
          }
        } catch (_) { }
      }
    });

    function escHtml(s) {
      return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
  </script>
</body>

</html>
